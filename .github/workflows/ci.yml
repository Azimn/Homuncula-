name: Voice Ruff Diagnostic

on:
  push:
    branches:
      - "diagnostic/**"

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install ruff==0.16.10
      - name: Show Ruff patch
        run: python -m ruff check src/homuncula/voice.py --fix --diff
